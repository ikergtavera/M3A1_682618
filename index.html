<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tienda Demo</title>
  <!-- Enlace a CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1 id="site-title">Tienda Demo</h1>
    <nav>
      <a href="#home" class="nav-link">Inicio</a>
      <a href="#productos" class="nav-link">Productos</a>
      <a href="#contacto" class="nav-link nav-link-last">Contacto</a>
    </nav>
  </header>

  <main>
    <section id="home" class="mb-24">
      <h2>Bienvenido</h2>
      <p class="intro-text">
        Esta es una tienda de ejemplo. Explora nuestros productos destacados.
      </p>
      <button class="btn">
        Ver ofertas
      </button>
    </section>

    <section id="productos" class="mb-24 grid-2">
      <article class="card">
        <h3>Camiseta</h3>
        <p>Algodón 100%, varias tallas.</p>
        <span class="badge">$199</span>
      </article>

      <article class="card">
        <h3>Sudadera</h3>
        <p>Cómoda y abrigadora.</p>
        <span class="badge">$399</span>
      </article>
    </section>

    <section id="contacto" class="mb-24">
      <h2>Contacto</h2>
      <a href="mailto:info@tienda.demo" class="link-primary">Escríbenos</a>
    </section>
  </main>

  <footer>
    <small>&copy; 2025 Tienda Demo</small>
  </footer>
</body>
</html>
